<div id="custom-modern-form" class="modern-form-wrapper" style="width: 100%; max-width: 1600px; margin-top: 0px; margin-right: auto; margin-bottom: 0px; margin-left: auto;">
  <div class="power-pages-form-container" style="width: 100%; overflow-x: visible; overflow-y: visible;"><div class="ppFlexContainer" style="width: 100%; max-width: 100%;">{% entityform name: 'Anexos Análise Preliminar' %}</div></div>
</div>
<script>
(function () {
  let usuarioSelecionouArquivo = false;
  let jaSubmeteu = false;
  let jaAvisouPai = false;

  function avisarPaiCarregando() {
    if (jaAvisouPai) return;
    jaAvisouPai = true;

    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        type: "ANEXO_PRELIMINAR_CARREGANDO"
      }, "*");
    }
  }

  function encontrarBotaoSalvar() {
    return (
      document.querySelector("#UpdateButton") ||
      document.querySelector("input[type='submit']") ||
      document.querySelector("button[type='submit']") ||
      document.querySelector(".submit-btn")
    );
  }

  function criarPreviewArquivo(nomeArquivo) {
    const form = document.querySelector("#custom-modern-form");
    const inputFile = document.querySelector("#custom-modern-form input[type='file']");

    if (!form || !inputFile) return;

    let lista = document.querySelector(".upload-doc-lista-preview");

    if (!lista) {
      lista = document.createElement("div");
      lista.className = "upload-doc-lista upload-doc-lista-preview";

      lista.innerHTML = `
        <div class="upload-doc-lista-head">
          <div class="upload-doc-lista-titulo">Arquivo selecionado</div>
        </div>

        <div class="upload-doc-grid"></div>
      `;

      inputFile.closest(".control")?.appendChild(lista);
    }

    const grid = lista.querySelector(".upload-doc-grid");
    if (!grid) return;

    grid.innerHTML = `
      <div class="upload-doc-item upload-doc-item-carregando">
        <div class="upload-doc-icon">
          <span class="upload-doc-spinner"></span>
        </div>

        <div class="upload-doc-info">
          <div class="upload-doc-nome">
            ${nomeArquivo || "Arquivo selecionado"}
          </div>
          <div class="upload-doc-status-carregando">
            CARREGANDO ANEXO...
          </div>
        </div>
      </div>
    `;
  }

  function submeterAutomaticamente() {
    if (!usuarioSelecionouArquivo) return;
    if (jaSubmeteu) return;

    const botaoSalvar = encontrarBotaoSalvar();

    if (!botaoSalvar) {
      console.warn("Botão salvar não encontrado.");
      return;
    }

    jaSubmeteu = true;
    avisarPaiCarregando();

    setTimeout(function () {
      botaoSalvar.click();
    }, 2500);
  }

  document.addEventListener("change", function (e) {
    const inputFile = e.target;

    if (!inputFile || inputFile.type !== "file") return;
    if (!inputFile.files || inputFile.files.length === 0) return;

    usuarioSelecionouArquivo = true;

    const arquivo = inputFile.files[0];
    criarPreviewArquivo(arquivo ? arquivo.name : "Arquivo selecionado");

    setTimeout(function () {
      submeterAutomaticamente();
    }, 3500);
  }, true);
})();
</script>

<script>
(function () {
  function avisarPaginaPai() {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        type: "ANEXO_PRELIMINAR_SALVO"
      }, "*");
    }
  }

  const observer = new MutationObserver(function () {
    const sucesso =
      document.querySelector(".alert-success") ||
      document.querySelector(".success") ||
      document.querySelector("[data-form-success]");

    if (sucesso && sucesso.innerText.trim() !== "") {
      avisarPaginaPai();
    }
  });

  observer.observe(document.body, {
    childList: true,
    subtree: true
  });
})();
</script>
<div class="row sectionBlockLayout text-start" style="display: flex; flex-wrap: wrap; min-height: auto; margin: 0px; padding: 0px; max-width: none; width: 100%;">
  <div class="container" style="padding: 0px; display: flex; flex-wrap: wrap; margin-top: 0px; margin-right: 0px; margin-bottom: 0px; margin-left: 0px; padding-top: 0px; padding-right: 0px; padding-bottom: 0px; padding-left: 0px; max-width: none; width: 100%;"><div class="col-lg-12 columnBlockLayout" style="flex-grow: 1; display: flex; flex-direction: column; min-width: 250px; margin: 0px; padding: 0px; max-width: none; width: 100%;"></div></div>
</div>
